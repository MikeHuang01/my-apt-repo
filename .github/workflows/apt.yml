name: Build and deploy APT repository

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build APT index
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y apt-utils
          mkdir -p site
          find . -type f -name '*.deb' -not -path './site/*' -exec cp {} site/ \;
          if [ -f 'NoAds.png' ]; then cp 'NoAds.png' site/CydiaIcon.png; fi
          if [ -f 'NoAds.png' ]; then cp 'NoAds.png' site/NoAds.png; fi
          if [ ! -f 'site/CydiaIcon.png' ]; then for icon in 'CydiaIcon.png' '微信图片_2026-11-01_055300_739.jpg' '4a46117aea0e822d3f65b625030a959f.jpg'; do
              if [ -f "$icon" ]; then cp "$icon" site/CydiaIcon.png; break; fi
            done
          fi
          if [ -f 'NoAds-Depiction.json' ]; then cp 'NoAds-Depiction.json' site/NoAds-Depiction.json; fi
          for image in 'NoAds-Screenshot-1.jpg' 'NoAds-Screenshot-2.jpg'; do
            if [ -f "$image" ]; then cp "$image" site/; fi
          done
          cd site
          apt-ftparchive packages . > Packages
          if [ -f 'NoAds-Depiction.json' ]; then
            python3 - <<'PY'
          from pathlib import Path

          path = Path("Packages")
          entries = path.read_text(encoding="utf-8").split("\n\n")
          output = []
          for entry in entries:
              lines = entry.splitlines()
              if lines and lines[0] == "Package: com.mikehuang01.noads":
                  lines = [
                      "Icon: https://mikehuang01.github.io/my-apt-repo/NoAds.png"
                      if line.startswith("Icon:") else line
                      for line in lines
                  ]
                  lines.append("SileoDepiction: https://mikehuang01.github.io/my-apt-repo/NoAds-Depiction.json")
              output.append("\n".join(lines))
          path.write_text("\n\n".join(output).rstrip() + "\n", encoding="utf-8")
          PY
          fi
          gzip -kf Packages
          apt-ftparchive \
            -o APT::FTPArchive::Release::Origin="MikeHuang01" \
            -o APT::FTPArchive::Release::Label="my-apt-repo" \
            -o APT::FTPArchive::Release::Architectures="iphoneos-arm iphoneos-arm64 iphoneos-arm64e" \
            -o APT::FTPArchive::Release::Components="." \
            release . > Release
          printf '架构: iphoneos-arm64e / iphoneos-arm64 / iphoneos-arm\n组件: .\n' > index.html
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
