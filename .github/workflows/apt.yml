name: Build and deploy APT repository

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build APT index
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y apt-utils dpkg-dev libarchive-tools

          mkdir -p site
          find . -type f -name '*.deb' -not -path './site/*' -exec cp {} site/ \;

          # Replace both earlier ActionBar builds, including the invalid PAX archive.
          rm -f site/ActionBar-Reborn-1.1-2-MikeHuang01-beta-roothide-arm64e.deb
          rm -f site/ActionBar-Reborn-1.1-2-MikeHuang01.1-roothide-arm64e.deb

          # Reject malformed archives before publishing the source.
          for deb in site/*.deb; do
            dpkg-deb --info "$deb" >/dev/null
            dpkg-deb --contents "$deb" >/dev/null
          done

          # Repository icon: the GitHub avatar. Package icons are kept separate.
          if [ -f 'NoAds.png' ]; then cp 'NoAds.png' site/CydiaIcon.png; fi
          mkdir -p site/Icons
          if [ -f 'NoAds.png' ]; then cp 'NoAds.png' site/Icons/RepoIcon-20261106.png; fi
          if [ -f 'NoAds-Plugin.png' ]; then cp 'NoAds-Plugin.png' site/; fi
          if [ ! -f 'site/CydiaIcon.png' ]; then
            for icon in 'CydiaIcon.png' '微信图片_2026-11-01_055300_739.jpg' '4a46117aea0e822d3f65b625030a959f.jpg'; do
              if [ -f "$icon" ]; then cp "$icon" site/CydiaIcon.png; break; fi
            done
          fi

          for asset in 'NoAds-Depiction.json' 'FloatingView-Depiction.json' 'ActionBar-Depiction.json' 'Hello3Q-Depiction.json' 'NoAds-Screenshot-1.jpg' 'NoAds-Screenshot-2.jpg' 'FloatingView-Screenshot.jpg' 'Hello3Q-Screenshot.jpg'; do
            if [ -f "$asset" ]; then cp "$asset" site/; fi
          done

          cd site
          apt-ftparchive packages . > Packages
          python3 ../update_packages.py
          gzip -kf Packages

          apt-ftparchive \
            -o APT::FTPArchive::Release::Origin="MikeHuang01" \
            -o APT::FTPArchive::Release::Label="⭐ MikeHuang01" \
            -o APT::FTPArchive::Release::Architectures="iphoneos-arm iphoneos-arm64 iphoneos-arm64e" \
            -o APT::FTPArchive::Release::Components="." \
            release . > Release.tmp
          {
            printf 'Icon: https://mikehuang01.github.io/my-apt-repo/Icons/RepoIcon-20261106.png\n'
            cat Release.tmp
          } > Release
          rm Release.tmp
          printf '架构: iphoneos-arm64e / iphoneos-arm64 / iphoneos-arm\n组件: .\n' > index.html

      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
