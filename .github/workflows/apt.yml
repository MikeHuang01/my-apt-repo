name: Build and deploy APT repository

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build APT index
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y apt-utils
          mkdir -p site
          find . -type f -name '*.deb' -not -path './site/*' -exec cp --parents {} site/ +
          if [ -f '微信图片_2026-11-01_055300_739.jpg' ]; then cp '微信图片_2026-11-01_055300_739.jpg' site/CydiaIcon.png; fi
          cd site
          apt-ftparchive packages . > Packages
          gzip -kf Packages
          apt-ftparchive -o APT::FTPArchive::Release::Origin="MikeHuang01" -o APT::FTPArchive::Release::Label="my-apt-repo" -o APT::FTPArchive::Release::Architectures="iphoneos-arm iphoneos-arm64" -o APT::FTPArchive::Release::Components="." release . > Release
          cat > index.html <<'HTML'
          <!doctype html><meta charset="utf-8"><title>my-apt-repo</title>
          <h1>my-apt-repo</h1><p>MikeHuang01 iOS APT repository</p>
          <p>Categories: roothide packages, rootless plugins, Tweak, System, tools, apps, plugins.</p>
          HTML
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
